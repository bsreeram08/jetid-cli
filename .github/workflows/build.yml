name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            outfile: jetid-linux-x64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            outfile: jetid-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            outfile: jetid-macos-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            outfile: jetid-macos-x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            outfile: jetid-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Bundle JS
        run: bun run build:bundle

      - name: Build Go binary
        run: |
          cd go
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "../${{ matrix.outfile }}" .
        shell: bash

      - name: Sign binary (macOS)
        if: matrix.goos == 'darwin'
        run: |
          codesign --remove-signature "${{ matrix.outfile }}" || true
          codesign --sign - --force "${{ matrix.outfile }}"

      - name: Show binary size
        run: ls -lh ${{ matrix.outfile }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: jetid-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/jetid-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
